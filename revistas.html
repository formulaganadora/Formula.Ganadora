<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Revistas</title>
  <style>
    :root {
      --bg-color: #121212;
      --text-color: #ffffff;
      --card-bg: #1e1e1e;
      --accent: #c71515;
      --link-color: gold;
    }

    body.light {
      --bg-color: #f2f2f2;
      --text-color: #111;
      --card-bg: #ffffff;
      --accent: #e74c3c;
      --link-color: #d35400;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.3s, color 0.3s;
    }

    header {
      background-color: var(--accent);
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 2.5em;
      color: white;
    }

    .mode-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      background: var(--card-bg);
      border: none;
      color: var(--text-color);
      padding: 10px 15px;
      cursor: pointer;
      border-radius: 8px;
      transition: background 0.3s;
    }

    .intro {
      text-align: center;
      padding: 20px;
      font-size: 1.1em;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 30px;
      padding: 20px;
      max-width: 1200px;
      margin: auto;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      text-align: center;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card img {
      width: 100%;
      height: auto;
    }

    .card h4 a {
      display: block;
      padding: 15px;
      text-decoration: none;
      color: var(--link-color);
      font-size: 1.1em;
      transition: color 0.3s;
    }

    .card h4 a:hover {
      color: white;
    }

    footer {
      text-align: center;
      padding: 20px;
      background-color: var(--card-bg);
      margin-top: 30px;
    }

    footer a {
      color: var(--link-color);
      text-decoration: none;
      font-size: 1em;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 2em;
      }

      .mode-toggle {
        padding: 8px 12px;
        top: 10px;
        right: 10px;
      }
    }
  </style>
</head>

  <script>
    function toggleMode() {
      document.body.classList.toggle("light");
      localStorage.setItem("theme", document.body.classList.contains("light") ? "light" : "dark");
    }

    window.onload = () => {
      const savedTheme = localStorage.getItem("theme");
      if (savedTheme === "light") {
        document.body.classList.add("light");
      }
    };
  </script>

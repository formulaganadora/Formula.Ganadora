<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gráfico de Precios de Pilotos</title>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <style>
    :root {
      --bg-color: #fff1f1;
      --text-color: white;
      --card-bg: #ff0000;
      --accent: #ff3c3c;
      --link-color: #ffcc00;
      --update-bg: #eee;
      --update-text: #222;
      --primary-color: #ff3c3c;
      --hover-color: #ff7f7f;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
    }

    header {
      background-color: var(--primary-color);
      color: white;
      text-align: center;
      padding: 1rem;
    }

    nav {
      background-color: var(--card-bg);
      display: flex;
      justify-content: center;
      padding: 10px 0;
    }

    nav a {
      color: whitesmoke;
      text-decoration: none;
      padding: 12px 20px;
      margin: 0 10px;
      border-radius: 5px;
      background-color: black;
      transition: background-color 0.3s;
    }

    nav a:hover {
      background-color: var(--accent);
    }

    .container {
      padding: 1rem 2rem;
    }

    #chart {
      width: 100%;
      height: 700px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Gráfico de Precios de Pilotos</h1>
  </header>
  <nav>
    <a href="index.html">Inicio</a>
    <a href="fantasy.html">Elección para la próxima carrera</a>
    <a href="#usuarios">Clasificación Usuarios</a>
    <a href="#pilotos">Clasificación Pilotos</a>
    <a href="#equipos">Clasificación Constructores</a>
  </nav>
  <div class="container">
    <div id="chart"></div>
  </div>
  <script>
    const carreras = [
      "Australia", "China", "Japón", "Baréin", "Arabia Saudí",
      "Miami", "Imola", "Mónaco", "España", "Canadá", "Austria", "Gran Bretaña",
      "Bélgica", "Hungría", "Países Bajos", "Italia", "Azerbaiyán", "Singapur",
      "Estados Unidos", "México", "Brasil", "Las Vegas", "Catar", "Abu Dhabi"
    ];

    const pilotos = [
      "Pierre Gasly", "Jack Doohan", "Fernando Alonso", "Lance Stroll",
      "Charles Leclerc", "Lewis Hamilton", "Esteban Ocon", "Ollie Bearman",
      "Lando Norris", "Oscar Piastri", "George Russell", "Kimi Antonelli",
      "Liam Lawson", "Isack Hadjar", "Max Verstappen", "Yuki Tsunoda",
      "Nico Hülkenberg", "Gabriel Bortoleto", "Carlos Sainz", "Alexander Albon"
    ];

    const precios = [
      13.4, 9.4, 16.9, 15.5, 23.5, 19.2, 13.4, 11.5, 35.4, 27.8,
      27.9, 22.3, 18.8, 16.9, 36.1, 17.1, 12.4, 6.7, 18.4, 17.3,
      12.9, 9.1, 15.9, 15.3, 22.3, 19.6, 13.8, 11.4, 38.9, 32,
      30.8, 22.8, 18.2, 16.4, 37.7, 16.2, 12.2, 6.6, 17.7, 17.1,
      12.4, 8.8, 15.4, 14.8, 23, 19.4, 13.2, 11.1, 40.7, 32.5,
      30.5, 22.8, 17.7, 16.4, 40.5, 15.4, 12, 6.5, 16.8, 16.6,
      12.4, 8.5, 14.9, 14.4, 24, 19.7, 12.7, 10.7, 40.7, 35.4,
      32.3, 21.4, 17.2, 15.9, 39.3, 14.9, 11.8, 6.4, 15.5, 15.8,
      11.5, 8.2, 14.5, 14, 25.1, 19.5, 12.2, 10.3, 39.9, 36.5,
      32.3, 21.2, 16.7, 15.6, 40.5, 13.7, 11.6, 6.3, 15.2, 15.3
    ];

    const data = [];

    for (let i = 0; i < pilotos.length; i++) {
      const valores = [];

      for (let j = 0; j < carreras.length; j++) {
        const index = j * pilotos.length + i;
        valores.push(index < precios.length ? precios[index] : null);
      }

      data.push({
        x: carreras,
        y: valores,
        type: 'scatter',
        mode: 'lines+markers',
        name: pilotos[i],
        line: { shape: 'spline' }
      });
    }

    Plotly.newPlot('chart', data, {
      title: 'Evolución de Precios de Pilotos (2025)',
      xaxis: { title: 'Carreras' },
      yaxis: { title: 'Valor (€ millones)', rangemode: 'tozero' },
      legend: { orientation: 'h' }
    });
  </script>
</body>
</html>
